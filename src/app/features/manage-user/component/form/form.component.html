<form
  class="form-container d-flex gap-l flex-column pt-l"
  [formGroup]="userForm"
  (ngSubmit)="submit()"
>
  <div class="d-flex gap-l">
    <div class="form-info fs-default fw-bold w-30">Personal Information</div>
    <div class="d-flex gap-l flex-wrap">
      <div>
        <app-input-text
          [control]="getControl('name')"
          label="Name"
          [placeholder]="'Enter Name'"
        ></app-input-text>
        <app-error-message
          [control]="getControl('name')"
          [errorMessages]="errorMessageConst.NAME"
        >
        </app-error-message>
      </div>
      <div>
        <app-input-text
          [control]="getControl('username')"
          label="Username"
          [placeholder]="'Enter username'"
        ></app-input-text>
        <app-error-message
          [control]="getControl('username')"
          [errorMessages]="errorMessageConst.USERNAME"
        ></app-error-message>
      </div>
    </div>
  </div>
  <div class="d-flex gap-l">
    <div class="form-info fs-default fw-bold w-30">Contact Details</div>
    <div class="d-flex gap-l flex-wrap">
      <div>
        <app-input-text
          [control]="getControl('email')"
          label="Email"
          [placeholder]="'Enter Email'"
        ></app-input-text>
        <app-error-message
          [control]="getControl('email')"
          [errorMessages]="errorMessageConst.EMAIL"
        >
        </app-error-message>
      </div>
      <div>
        <app-input-text
          [control]="getControl('phonenumber')"
          label="Phone number"
          [placeholder]="'Enter phonenumber'"
        ></app-input-text>
        <app-error-message
          [control]="getControl('phonenumber')"
          [errorMessages]="errorMessageConst.PHONENUMBER"
        ></app-error-message>
      </div>
    </div>
  </div>
  <div class="d-flex gap-l">
    <div class="form-info fs-default fw-bold w-30">Security Information</div>
    <div class="d-flex gap-l flex-wrap">
      <div>
        <app-input-text
          [control]="getControl('password')"
          label="Password"
          [placeholder]="'Enter Password'"
        ></app-input-text>
        <app-error-message
          [control]="getControl('password')"
          [errorMessages]="errorMessageConst.PASSWORD"
        >
        </app-error-message>
      </div>
    </div>
  </div>
  <div class="d-flex gap-l">
    <div class="form-info fs-default fw-bold w-30">Roles</div>
    <div class="form-container">
      <app-select
        [control]="getControl('role')"
        label="Role"
        [placeholder]="'Select Role'"
        [options]="roles"
      ></app-select>
    </div>
    <app-error-message
      [control]="getControl('password')"
      [errorMessages]="errorMessageConst.ROLE"
    >
    </app-error-message>
  </div>

  <div class="d-flex align-items-center gap-md">
    <app-button [config]="createBtnConfig"> </app-button>
    <app-button [config]="cancelBtnConfig" (onClick)="cancel()"> </app-button>
  </div>
</form>
