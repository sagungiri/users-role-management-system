<form
  class="form-container d-flex gap-l flex-column pt-l"
  [formGroup]="rolesForm"
  (ngSubmit)="submit()"
>
  <div class="d-flex gap-l">
    <div class="form-info fs-default fw-bold w-30">General Information</div>
    <div class="d-flex gap-l flex-wrap">
      <div>
        <app-input-text
          [control]="getControl('name')"
          label="Name"
          [placeholder]="'Enter Name'"
        ></app-input-text>
        <app-error-message
          [control]="getControl('name')"
          [errorMessages]="errorMessageConst.NAME"
        >
        </app-error-message>
      </div>
      <div>
        <app-input-text
          [control]="getControl('label')"
          label="Label"
          [placeholder]="'Enter Label'"
        ></app-input-text>
        <app-error-message
          [control]="getControl('label')"
          [errorMessages]="errorMessageConst.LABEL"
        ></app-error-message>
      </div>
    </div>
  </div>
  <div class="d-flex gap-l">
    <div class="form-info fs-default fw-bold w-30">Permission</div>
    <div class="form-container">
      <app-checkbox-group
        [options]="permissionsOptions"
        [control]="getControl('permissions')"
        label="Permissions"
        [isDisabled]="isDisabled"
      ></app-checkbox-group>
      <app-error-message
        [control]="getControl('permissions')"
        [errorMessages]="errorMessageConst.PERMISSION"
      ></app-error-message>
    </div>
  </div>

  <div class="d-flex align-items-center gap-md">
    <app-button [config]="createBtnConfig"> </app-button>
    <app-button [config]="cancelBtnConfig" (onClick)="cancel()"> </app-button>
  </div>
</form>
