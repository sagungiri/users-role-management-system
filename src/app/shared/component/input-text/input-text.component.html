<div class="d-flex flex-column gap-xxsm">
  <label class="form-label fw-bold fs-md color-text" [for]="control">{{
    label
  }}</label>
  <input
    [type]="inputType"
    [formControl]="control"
    [placeholder]="placeholder"
    [disabled]="isDisabled"
    [ngClass]="{
      'input-field': true,
      'invalid-input': control.invalid && (control.dirty || control.touched)
    }"
  />
</div>
